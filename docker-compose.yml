services:
  db:
    image: postgres:16
    container_name: tutorai_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: tutor_senas_db
    ports:
      - "5432:5432"
    volumes:
      - tutorai_postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tutorai_backend_python
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://admin:password123@db:5432/tutor_senas_db
      SECRET_KEY: change-this-secret-key
    ports:
      - "8888:8888"

volumes:
  tutorai_postgres:
