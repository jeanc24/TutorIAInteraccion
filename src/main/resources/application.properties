spring.application.name=TutorIAInteraccion
server.port=8888

# 1. Base de datos H2 en ARCHIVO LOCAL (Se creará una carpeta 'data' en tu proyecto)
spring.datasource.url=jdbc:h2:file:./data/tutor_senas_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Cambiamos 'create' por 'update' para que los datos sobrevivan al reiniciar
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Clave secreta JWT
app.jwt.secret=RmxhQnVnY2FkQWJjREVGMTIzNDU2Nzg5MGFiY2RlRkdISUpLTE1O
app.jwt.expiration-ms=86400000

# Límite de subida de archivos (Videos hasta 50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB