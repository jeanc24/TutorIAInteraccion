<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - SignTutor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="navbar">
    <div class="logo">🛠️ Admin SignTutor</div>
    <div class="user-info">
        <button id="btn-home" class="btn secondary small">Volver</button>
        <button id="btn-logout" class="btn primary small">Cerrar Sesión</button>
    </div>
</header>

<main class="admin-layout" style="display: block;">

    <div class="tabs">
        <button class="tab-btn active" data-target="users-section">Gestión de Estudiantes</button>
        <button class="tab-btn" data-target="senas-section">Catálogo de Señas</button>
    </div>

    <section id="users-section" class="admin-card tab-content active">
        <form id="user-form" class="grid-form">
            <input type="hidden" id="user-id">
            <input id="user-name" type="text" placeholder="Nombre" required>
            <input id="user-email" type="email" placeholder="Email" required>
            <input id="user-password" type="password" placeholder="Contraseña (solo para crear o cambiar)">
            <select id="user-role">
                <option value="ESTUDIANTE">ESTUDIANTE</option>
                <option value="ADMIN">ADMIN</option>
            </select>
            <button type="submit" class="btn primary">Guardar Usuario</button>
        </form>
        <div class="table-wrapper">
            <table>
                <thead>
                <tr><th>ID</th><th>Nombre</th><th>Email</th><th>Rol</th><th>Acciones</th></tr>
                </thead>
                <tbody id="users-table-body"></tbody>
            </table>
        </div>
    </section>

    <section id="senas-section" class="admin-card tab-content">
        <form id="sena-form" class="grid-form">
            <input type="hidden" id="sena-id">
            <input id="sena-name" type="text" placeholder="Nombre de la seña" required>
            <input id="sena-category" type="text" placeholder="Categoría (Ej. Saludos)" required>
            <select id="sena-difficulty" required>
                <option value="" disabled selected>Selecciona Dificultad</option>
                <option value="FACIL">FÁCIL</option>
                <option value="MEDIO">MEDIO</option>
                <option value="DIFICIL">DIFÍCIL</option>
            </select>

            <div class="drop-zone" id="drop-zone">
                <span class="drop-icon">📁</span>
                <p id="drop-text">Arrastra tu video aquí o haz clic para buscar (.mp4)</p>
                <input type="file" id="video-file" accept="video/mp4,video/*" class="hidden-input">
            </div>

            <p class="text-center">- O usa una URL externa -</p>
            <input id="sena-video-url" type="text" placeholder="Enlace de YouTube (Solo si no subes archivo)">

            <button type="submit" class="btn primary">Guardar Seña</button>
        </form>
        <div class="table-wrapper">
            <table>
                <thead>
                <tr><th>ID</th><th>Nombre</th><th>Categoría</th><th>Dificultad</th><th>Video URL</th><th>Acciones</th></tr>
                </thead>
                <tbody id="senas-table-body"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="js/admin.js"></script>
</body>
</html>
